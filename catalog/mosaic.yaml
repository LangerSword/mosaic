title: Mosaic
description: "A design reference engine for Hermes Agent. Mosaic turns a studied reference or a product brief into an original interface direction: a base field, one accent, a type pairing, two signature moves, a composition order, motion rules and an audit checklist. It ships 20 skills and 11 local tools: mosaic_index, mosaic_study, mosaic_design, mosaic_components, mosaic_stacks, mosaic_forge, mosaic_invent, mosaic_recipe, mosaic_audit, mosaic_critique and mosaic_score. mosaic_forge emits an original component starter for HTML, React, Next, Svelte, Vue or Astro, with CSS or GSAP motion. It does not clone a reference, copy paid code or call a network. Disclosure: local only; no network, no telemetry, no credentials; mosaic_audit reads a caller-selected local text file; the recipe and component index are bundled data; no hooks or middleware."
