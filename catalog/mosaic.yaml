title: Mosaic
description: "A design reference engine for Hermes Agent. Mosaic turns a studied reference or a product brief into an original interface direction: a base field, one accent, a type pairing, two signature moves, a composition order, motion rules and an audit checklist. It ships 23 skills and 13 local tools: mosaic_index, mosaic_study, mosaic_design, mosaic_components, mosaic_stacks, mosaic_forge, mosaic_invent, mosaic_recipe, mosaic_audit, mosaic_critique, mosaic_score, mosaic_taste and mosaic_visual. mosaic_forge emits an original component starter for HTML, React, Next, Svelte, Vue or Astro, with CSS or GSAP motion. mosaic_taste reports deterministic taste proxies with confidence and an explicit pairwise calibration contract. mosaic_visual renders a caller-built URL or local HTML page in local Chromium and returns measured hard gates, screenshots and an evidence id. It does not clone a reference, copy paid code or call a network. Disclosure: local only; no network from the plugin, no telemetry, no credentials; mosaic_audit and mosaic_score read caller-selected local text; the visual gate launches a local browser and a page may load its own assets; the recipe and component index are bundled data; no hooks or middleware."
