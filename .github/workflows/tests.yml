name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Load and dispatch
        run: python smoke_load.py
      - name: CLI smoke
        run: python mosaic_cli.py recipe --brief "A quiet portfolio for a type designer" --mood editorial
